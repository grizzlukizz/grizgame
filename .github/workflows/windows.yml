name: Windows game

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.17.0
      - name: Build portable Windows game
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Zone04 --additional-hooks-dir packaging quarantine.py
      - name: Check executable and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path README.md,quarantine.py,requirements.txt,Create-Desktop-Shortcut.bat -Destination dist/Zone04
          python -c "import shutil; shutil.make_archive('Zone04-Windows', 'zip', 'dist', 'Zone04')"
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }
          Expand-Archive -Path Zone04-Windows.zip -DestinationPath verification
          $game = (Resolve-Path verification/Zone04).Path
          $exe = Join-Path $game 'Zone04.exe'
          $dll = Join-Path $game '_internal/python312.dll'
          if (!(Test-Path $dll)) { throw 'Bundled Python DLL is missing' }
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-build' -WorkingDirectory $game -PassThru
          if (!$probe.WaitForExit(30000)) {
            Stop-Process -Id $probe.Id -Force
            throw 'Packaged executable did not finish its startup check'
          }
          if ($probe.ExitCode -ne 0) { throw "Packaged executable failed its startup check: $($probe.ExitCode)" }
          & (Join-Path $game 'Create-Desktop-Shortcut.bat') --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Creating the desktop shortcut failed' }
          $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
          $shortcutPath = Join-Path $desktop 'Zone 04.lnk'
          if (!(Test-Path $shortcutPath)) { throw 'Desktop shortcut is missing' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ne $exe -or $shortcut.WorkingDirectory.TrimEnd([char]92) -ne $game) {
            throw 'Desktop shortcut points to the wrong location'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Zone04-Windows
          path: Zone04-Windows.zip
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Zone04-Windows.zip --verify-tag --title "Зона 04" --generate-notes
